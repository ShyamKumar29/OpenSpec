# Deterministic classification pre-pass abbreviation dictionary (`CLS`, M1 —
# docs/domain/pvf-reference.md §8: "the deterministic pre-pass that resolves
# ~40% of classification with no LLM call"). Transcribed verbatim from that
# already-reviewed project document, not from any client-supplied file — this
# is OpenSpec's own documented domain knowledge, the same provenance
# discipline `resources/nrm/connection_synonyms.yaml` already established for
# NRM (UH4, docs/16-unilog-alignment.md).
