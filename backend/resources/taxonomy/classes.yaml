# Declarative taxonomy (docs/05-backend.md §1 `resources/taxonomy/`, docs/04-data-model.md
# §3.2 `taxonomy_class` / `attribute_definition`). Hand-authored, reviewed in PRs — never
# generated by an LLM, never hardcoded in Python (docs/03-ai-pipeline.md, CLAUDE.md
# "Schemas & rules: Declarative YAML in backend/resources/. Not code.").
#
# One class today (BALL_VALVE_BRONZE), a representative subset of the 22-attribute
# schema in docs/domain/pvf-reference.md §3 — enough to exercise every risk tier
# (0-3) and prove the schema-loading path end to end. Widening to the full schema and
# the other four PVF classes is resources-only work (no code change) — see
# docs/15-backend-implementation-status.md.
schema_version: "1"
classes:
  - code: BALL_VALVE_BRONZE
    name: "Ball Valve, Bronze/Brass"
    external_ref: null
    attributes:
      - code: nominal_size
        name: "Nominal Size"
        datatype: designation
        risk_tier: 1
        is_mandatory: true
        unit_dimension: null
        allowed_values: null
      - code: body_material
        name: "Body Material"
        datatype: enum
        risk_tier: 1
        is_mandatory: true
        unit_dimension: null
        allowed_values: [BRASS, BRONZE, CI, DUCTILE_IRON, CS, SS304, SS316]
      - code: end_connection_inlet
        name: "End Connection (Inlet)"
        datatype: enum
        risk_tier: 1
        is_mandatory: true
        unit_dimension: null
        allowed_values: null
      - code: pressure_rating_wog
        name: "Pressure Rating (WOG)"
        datatype: pressure
        risk_tier: 0
        is_mandatory: true
        unit_dimension: pressure
        allowed_values: null
      - code: pressure_rating_wsp
        name: "Pressure Rating (WSP)"
        datatype: pressure
        risk_tier: 0
        is_mandatory: true
        unit_dimension: pressure
        allowed_values: null
      - code: ansi_class
        name: "ANSI Class"
        datatype: enum
        risk_tier: 0
        is_mandatory: true
        unit_dimension: null
        allowed_values: ["125", "150", "300", "600"]
      - code: temperature_range
        name: "Temperature Range"
        datatype: temperature_range
        risk_tier: 0
        is_mandatory: true
        unit_dimension: temperature
        allowed_values: null
      - code: seat_material
        name: "Seat Material"
        datatype: enum
        risk_tier: 2
        is_mandatory: true
        unit_dimension: null
        allowed_values: [PTFE, RPTFE, PEEK, NYLON]
      - code: handle_type
        name: "Handle Type"
        datatype: enum
        risk_tier: 3
        is_mandatory: true
        unit_dimension: null
        allowed_values: [LEVER, TEE, OVAL, LOCKING]
      - code: lead_free_compliance
        name: "Lead-Free Compliance"
        datatype: bool
        risk_tier: 0
        is_mandatory: true
        unit_dimension: null
        allowed_values: null
      - code: potable_water_listing
        name: "Potable Water Listing"
        datatype: enum
        risk_tier: 0
        is_mandatory: true
        unit_dimension: null
        allowed_values: [NSF_61, NONE]
